"""
Public Cadence slot mint — fixed-price capacity purchase for one epoch.
"""
type CadenceMint @entity(immutable: true) {
  id: ID!
  epochId: BigInt!
  buyer: Bytes!
  size: BigInt!
  pricePaid: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Private Cadence Intent — commitment H. Size is NOT indexed here; it is
hidden until reveal (commit hash public, not private forever).
"""
type CadenceCommit @entity(immutable: true) {
  id: ID!
  epochId: BigInt!
  H: Bytes!
  payer: Bytes!
  escrow: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  reveal: CadenceReveal
}

"""
SlotRevealed — the reveal at fill time. This is where size becomes public.
"""
type CadenceReveal @entity(immutable: true) {
  id: ID!
  epochId: BigInt!
  H: Bytes!
  trader: Bytes!
  size: BigInt!
  consumed: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
  commit: CadenceCommit!
}

"""
SlotConsumed — public-path capacity burn at fill time.
"""
type CadenceConsume @entity(immutable: true) {
  id: ID!
  epochId: BigInt!
  trader: Bytes!
  size: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Hook fill — the trade executed against ACTIVE reserves only.
Out is the quote-token amount received; a naive markout/LVR proxy compares
out at fill with the value one block later (external prices off-chain).
"""
type CadenceSwap @entity(immutable: true) {
  id: ID!
  epochId: BigInt!
  trader: Bytes!
  zeroForOne: Boolean!
  sizeInEth: BigInt!
  outAmount: BigInt!
  fromCommitment: Boolean!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

"""
Per-epoch active/passive partition — the depth ledger.
"""
type PoolState @entity(immutable: true) {
  id: ID!
  epochId: BigInt!
  activeEth: BigInt!
  activeUsdc: BigInt!
  passiveEth: BigInt!
  passiveUsdc: BigInt!
  capacityBudgetEth: BigInt!
  timestamp: BigInt!
}

type Global @entity(immutable: true) {
  id: ID!
  totalMinted: BigInt!
  totalCommitted: BigInt!
  totalRevealed: BigInt!
  totalConsumed: BigInt!
  totalSwaps: BigInt!
}
