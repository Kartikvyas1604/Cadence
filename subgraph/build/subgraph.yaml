specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: schema.graphql
dataSources:
  - kind: ethereum
    name: CadenceSlots
    network: sepolia
    source:
      address: "0xC620503245E175cC805CB5ab67E2ae80262ef4C7"
      abi: CadenceSlots
      startBlock: 11669908
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CadenceMint
        - CadenceCommit
        - CadenceReveal
        - CadenceConsume
      abis:
        - name: CadenceSlots
          file: CadenceSlots/CadenceSlots.json
      eventHandlers:
        - event: SlotMinted(indexed uint256,indexed address,uint256,uint256)
          handler: handleSlotMinted
        - event: SlotCommitted(indexed uint256,indexed bytes32,indexed address,uint256)
          handler: handleSlotCommitted
        - event: SlotRevealed(indexed uint256,indexed bytes32,indexed address,uint256,uint256)
          handler: handleSlotRevealed
        - event: SlotConsumed(indexed uint256,indexed address,uint256)
          handler: handleSlotConsumed
      file: CadenceSlots/CadenceSlots.wasm
  - kind: ethereum
    name: CadenceHook
    network: sepolia
    source:
      address: "0x5fD91266BF19d3fF8d0596607C68FD2be8d44088"
      abi: CadenceHook
      startBlock: 11669908
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CadenceSwap
        - PoolState
      abis:
        - name: CadenceHook
          file: CadenceHook/CadenceHook.json
      eventHandlers:
        - event: CadenceSwap(indexed uint256,indexed address,bool,uint256,uint256,bool)
          handler: handleCadenceSwap
        - event: EpochRefreshed(indexed uint256,uint256,uint256,uint256,uint256)
          handler: handleEpochRefreshed
      file: CadenceSlots/CadenceSlots.wasm
