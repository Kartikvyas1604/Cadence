specVersion: 1.0.0
indexerHints:
  prune: never
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CadenceSlots
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # replaced at deploy — see subgraph/README
      abi: CadenceSlots
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CadenceMint
        - CadenceCommit
        - CadenceReveal
        - CadenceConsume
      abis:
        - name: CadenceSlots
          file: ./abis/CadenceSlots.json
      eventHandlers:
        - event: SlotMinted(indexed uint256,indexed address,uint256,uint256)
          handler: handleSlotMinted
        - event: SlotCommitted(indexed uint256,indexed bytes32,indexed address,uint256)
          handler: handleSlotCommitted
        - event: SlotRevealed(indexed uint256,indexed bytes32,indexed address,uint256,uint256)
          handler: handleSlotRevealed
        - event: SlotConsumed(indexed uint256,indexed address,uint256)
          handler: handleSlotConsumed
      file: ./src/cadence.ts
  - kind: ethereum
    name: CadenceHook
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000" # replaced at deploy — see subgraph/README
      abi: CadenceHook
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CadenceSwap
        - PoolState
      abis:
        - name: CadenceHook
          file: ./abis/CadenceHook.json
      eventHandlers:
        - event: CadenceSwap(indexed uint256,indexed address,bool,uint256,uint256,bool)
          handler: handleCadenceSwap
        - event: EpochRefreshed(indexed uint256,uint256,uint256,uint256,uint256)
          handler: handleEpochRefreshed
      file: ./src/cadence.ts
